<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>متابعة الدفع | RIVO</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/dashboard.css" />
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <header>
      <div class="wrap topbar"><a href="/">RIVO | ريفو</a><a href="/account">طلباتي</a></div>
    </header>
    <main class="wrap" style="max-width: 650px; padding-top: 48px; padding-bottom: 48px">
      <section class="panel">
        <h1 style="font-size: 28px">مراجعة الدفع</h1>
        <p id="payment-state" role="status">جاري تحميل الطلب…</p>
        <p id="payment-mode"></p>
        <p id="payment-amount" style="font-size: 30px; font-weight: 700" dir="ltr"></p>
        <p>عملة التحصيل هي الدولار الأمريكي. قد يطبّق مزوّد وسيلة الدفع رسوم تحويل خاصة به.</p>
        <p id="payment-error" class="form-error" role="alert"></p>
        <button id="payment-go" class="primary" hidden>تأكيد المبلغ والمتابعة إلى Payunit</button>
        <button id="payment-refresh" class="secondary" hidden>تحديث حالة الدفع</button>
        <p><a id="order-details" href="/account">تفاصيل الطلب والتسليم ←</a></p>
        <p><a href="/account">كل طلباتي</a></p>
      </section>
    </main>
    <script src="/payment.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>
